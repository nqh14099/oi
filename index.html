[C4,'4.2.2','Yêu cầu khi thi công xây dựng (1)','l',['Trước khi khởi công phải có thiết kế biện pháp thi công được duyệt, thể hiện giải pháp AT cho người và máy, thiết bị','Thi công tuân thủ thiết kế, tiêu chuẩn, quy chuẩn, quy trình kỹ thuật','Biện pháp thi công và giải pháp AT được xem xét định kỳ hoặc đột xuất để điều chỉnh','Người điều khiển máy và người thực hiện công việc có yêu cầu nghiêm ngặt về ATLĐ phải được huấn luyện và có thẻ AT lao động']],
[C4,'4.2.2','Yêu cầu khi thi công xây dựng (2)','l',['Máy, thiết bị có yêu cầu nghiêm ngặt về ATLĐ phải được kiểm định, đăng ký trước khi hoạt động','Máy, thiết bị vượt khỏi phạm vi mặt bằng công trường: chủ đầu tư phê duyệt biện pháp AT cho người, máy và công trình bị ảnh hưởng','Người tham gia thi công được khám sức khoẻ, huấn luyện về AT và cấp phát đủ phương tiện bảo vệ cá nhân']],
[C4,'4.3','Thiết kế biện pháp kỹ thuật AT (a): thi công trên cao và dưới sâu','l',['Tiến hành song song với thiết kế biện pháp kỹ thuật và tổ chức thi công','Thi công đất, chú trọng khi đào sâu (mục 8.1 chương 8 và 9.1 chương 9)','Thi công bê tông, bê tông cốt thép: chú ý công việc trên cao (mục 10.4 chương 10)','Lắp ghép kết cấu khối lượng, kích thước lớn: chọn phương pháp treo buộc, tháo dỡ AT; đưa công nhân lên xuống và làm việc trên cao']],
[C4,'4.3','Thiết kế biện pháp kỹ thuật AT (b–e)','l',['b) AT đi lại, giao thông vận chuyển: chú trọng các tuyến đường giao nhau; hệ thống cấp điện, cấp và thoát nước','c) Phòng tai nạn điện: nối đất cho các máy móc thiết bị điện; rào ngăn, treo biển báo nơi nguy hiểm','d) Làm hệ thống chống sét, đặc biệt các công trường có chiều cao lớn (mục 5.4 chương 5)','e) Biện pháp AT phòng chống cháy chung và nơi dễ phát sinh cháy; xây nhà cửa, kho tàng, nơi chứa nhiên liệu đúng quy phòng cháy']],
[C4,'4.4','Kỹ thuật ATLĐ khi lập tiến độ thi công','l',['Tiến độ có thể lập theo sơ đồ ngang, sơ đồ mạng, sơ đồ lịch hoặc sơ đồ dây chuyền','Chọn thời gian thi công sao cho bảo đảm AT cho mỗi công tác, mỗi quá trình phải hoàn thành trên công trường','Trình tự và thời gian thi công xác định trên cơ sở yêu cầu và điều kiện kỹ thuật, bảo đảm nhịp nhàng từng hạng mục','Thi công dây chuyền: không bố trí việc làm các tầng khác nhau trên cùng một phương đứng nếu không có sàn bảo vệ; không bố trí người làm việc dưới tầm hoạt động của cần trục; giữ nhịp làm việc giữa các tổ, đội để tránh chồng chéo']],
[C4,'4.5.1','Mặt bằng thi công: đường vận chuyển và nhà vệ sinh','s',['4|m|đường một chiều, bề rộng tối thiểu','7|m|đường hai chiều, bề rộng tối thiểu','50|m|tầm nhìn tại chỗ giao nhau','10|m|bán kính vòng nhỏ nhất','5|%|độ dốc ngang tối đa','100|m|khoảng cách tối đa của nhà vệ sinh']],
[C4,'4.5.1','Mặt bằng thi công: chiếu sáng, rào chắn, phòng cháy','l',['Chiếu sáng theo tiêu chuẩn; diện tích rộng trên 3000 m² dùng đèn pha đặt trên kết cấu cao không quá 6m; chiếu sáng nhỏ dưới 2 lux có thể dùng đèn dây tóc thường','Rào chắn vùng nguy hiểm: trạm biến thế, khu vực để vật liệu dễ cháy nổ, xung quanh giàn giáo, hố móng, hố vôi','Trên bình đồ xây dựng phải chỉ rõ nơi gây hỏa hoạn lớn và đường thoát người; bố trí chi tiết công trình phòng hoả','Có đường cho xe chữa cháy; thoát nước tốt để mặt bằng không bị úng ngập']],
[C4,'4.5.1','Mặt bằng thi công: xếp vật liệu (kích thước chống)','s',['1|m|đá hộc, gạch lát, ngói xếp ô vuông','25|lớp|gạch xây xếp tối đa','2,5|m|tấm sàn, tấm mái, khối móng xếp chồng','2|m|cột xếp thành chồng','1,5|m|thép hình, thép tấm, gỗ cây','1,2|m|gỗ xẻ xếp chồng']],
[C4,'4.5.1','Mặt bằng thi công: lưới điện trên công trường','l',['Mạng điện có sơ đồ chỉ dẫn, cầu dao chung (tổng) và cầu dao phân đoạn; động lực và chiếu sáng thiết kế hệ thống riêng','Dây dẫn điện treo trên cột hoặc giá đỡ chắc chắn; không trải trên mặt đất, mặt sàn','Dây trần treo cao tối thiểu 3,5m so với mặt bằng thi công và 6,0m so với có xe cộ qua lại','Dây cáp nơi có xe cộ đi qua lại phải đặt chìm dưới đất']],
[C4,'4.5.2','Thiết kế và bố trí mặt bằng công trường (a)','l',['Cần xem xét trình tự công việc, lối vào và đường vành đai cho công nhân; lối đi phải quang, không có chướng ngại','Bố trí rào chắn bảo vệ biên như lan can, cầu thang và nơi có độ cao từ 2m trở lên','Lưu chứa vật liệu gần nơi sản xuất tương ứng: cát, sỏi, xi măng gần nơi trộn bê tông','Bố trí máy móc: tháp cần trục tính hành trình quay của cần nâng, tránh quăng vật nâng vào công nhân']],
[C4,'4.5.2','Thiết kế và bố trí mặt bằng công trường (b–c)','l',['Bố trí y tế và chăm sóc; tiện nghi nghỉ vệ sinh cho cả nam và nữ; ánh sáng nhân tạo nơi làm việc liên tục','Rào chắn để người không có phận sự, trẻ em và người khác nói chung được giữ xa khỏi khu vực nguy hiểm; rào cao tối thiểu 2m và kín khít','Sự ngăn nắp: dọn vật liệu chưa cần, lau sạch dầu nhớt, nhổ hoặc đập bằng đinh nhọn ở các ván cốt pha','Công trường không gây ô nhiễm quá giới hạn, nguy hiểm cho dân cư, lún sụt nhà cửa, cản trở giao thông']],
['5','','Kỹ thuật an toàn điện trong xây dựng','ch'],
[C5,'5.1.1','Khái niệm về dòng điện và sự nguy hiểm của điện','l',['Điện được dùng ở nhiều công đoạn thi công; hậu quả tai nạn điện rất trầm trọng và chết người','Mức độ nguy hiểm phụ thuộc loại dòng điện, điện áp, cường độ, tần số, điện trở, môi trường xung quanh','Nơi làm việc chia ba mức: ít nguy hiểm, nguy hiểm, rất nguy hiểm']],
[C5,'5.1.1','Ba mức độ nguy hiểm của nơi làm việc','l',['Ít nguy hiểm: khô ráo, độ ẩm không khí không quá 75%, nhiệt độ không quá 30°C, không bụi dẫn điện, nền sàn không dẫn điện','Nguy hiểm: có một trong các yếu tố: ẩm trên 75%, nhiệt độ trên 30°C, bụi dẫn điện, nền sàn dẫn điện (kim loại, đất, gạch, bê tông ẩm)','Rất nguy hiểm: rất ẩm (gần 100%, có đọng sương); có hơi khí, bụi hoạt tính hóa học; hoặc có đồng thời hai yếu tố nguy hiểm']],
[C5,'5.1.1','Điện áp an toàn theo mức nguy hiểm','s',['36|V|điện áp tối đa dụng cụ cầm tay, đèn cục bộ nơi nguy hiểm','12|V|điện áp tối đa nơi rất nguy hiểm','75|%|ngưỡng độ ẩm không khí','30|°C|ngưỡng nhiệt độ','10|mA|dòng rò tối đa cho phép','1000|Ω/V|điện trở cách điện tối thiểu']],
[C5,'5.1.1','Phân loại gian nhà theo mức nguy hiểm điện','l',['Không nguy hiểm cao: nhà khô ráo, nhiệt độ bình thường, độ ẩm dưới 60%, sàn cách điện','Nguy hiểm cao: độ ẩm 60–75%, nhiệt độ vượt 35°C, có bụi dẫn điện, nền dẫn điện; ví dụ xưởng gia công gỗ, xưởng bê tông cốt thép','Đặc biệt nguy hiểm: ẩm gần 100%, môi trường hoạt tính hóa học; ví dụ rửa xe ngoài trời, trạm nạp acquy, nhà tắm','Nơi nguy hiểm: cấp điện cầm tay bằng điện áp thấp 42V và 12V, dùng biến thế hạ điện áp']],
[C5,'5.1.2','Tác động của dòng điện lên cơ thể người','l',['Nguy hiểm nhất là chạm vào hai pha: người chịu điện áp giữa hai dây dẫn','Dòng điện đi từ tay phải xuống chân, tay sang tay nguy hiểm hơn đi từ chân sang chân (qua tim, phổi)','Hai loại tổn thương: tổn thương cục bộ (bỏng, kim loại hóa bề mặt da) và điện giật (co giật cơ)','Chỉ cứu được nạn nhân nếu thời gian tác động của dòng điện không quá 4–5 phút']],
[C5,'5.1.2','Số liệu tai nạn điện và điện trở cơ thể','s',['1|%|tai nạn điện trong tổng tai nạn sản xuất','20–30|%|trong tổng số tai nạn chết người','80|%|chết người do điện xảy ra ở thiết bị dưới 1000V','1000|Ω|điện trở người Rng lấy khi tính toán','0,2|mm|lớp biểu bì da, điện trở lớn nhất (200–500Ω)','4–5|phút|thời gian cứu được nạn nhân']],
[C5,'5.1.2','Bảng 5.1: Cường độ dòng điện và cảm giác','l',['0,6–1,5 mA: xoay chiều (50–60Hz) bắt đầu tê ngón tay; một chiều không có cảm giác','2–3 mA: ngón tay tê mạnh; một chiều không có cảm giác','5–7 mA: bắp thịt tay co lại và rung; một chiều đau như kim châm và thấy nóng','10–15 mA: cơ tay bị co; 25–50mA: ảnh hưởng hô hấp; từ 50mA trở lên: rối loạn nhịp tim, có thể gây chết người']],
[C5,'5.2','Các trường hợp tiếp xúc với mạng điện','l',['Chạm vào hai pha khác nhau: người chịu điện áp dây, nguy hiểm nhất, dòng điện qua người có trị số lớn nhất','Chạm vào một pha của mạng có trung tính cách ly: coi như mắc vào mạng song song với điện trở cách điện của pha đó','Chạm vào một pha của mạng trung tính nối đất: trường hợp mạng ba pha điện áp nhỏ hơn 1000V','Điện áp bước: nếu điểm nào của mạng chạm đất, dòng điện rò vào đất tạo ra trường điện áp; quá 20m, giá trị rất nhỏ và không còn gây nguy hiểm']],
[C5,'5.3.1','Nguyên nhân gây tai nạn điện (1)','l',['Thiết bị điện gồm hai nhóm: điện áp dưới 1000V và trên 1000V; phần lớn tai nạn xảy ra ở thiết bị dưới 1000V','a) Xuất hiện điện áp trên bộ phận thiết bị không có điện áp khi bình thường (vỏ máy…) do hư hỏng lớp cách điện','b) Hồ quang điện giữa bộ phận dẫn điện thiết bị và con người; khoảng cách tối thiểu: 15kV cách 0,7m; 220kV cách 3,0m','c) Xuất hiện điện áp bước chân trên bề mặt đất do đoạn mạch của các dây dẫn xuống đất']],
[C5,'5.3.1','Nguyên nhân gây tai nạn điện (2)','l',['d) Sử dụng dụng cụ nơi điện thế 127V và 220V trong phòng ẩm ướt','e) Thiếu cầu chì hoặc cầu bảo vệ, thiếu nối đất, nối trung hoà','f) Tiếp xúc với dây dẫn điện không có tấm chắn bảo vệ; g) Đi vào vùng điện rò xuống đất','h) Thiếu hoặc dùng sai dụng cụ bảo vệ cá nhân: thảm cách điện, giày, ủng, găng tay cách điện','k) Công nhân sai sót, không theo quy tắc, tổ chức không tốt']],
[C5,'5.3.2','Biện pháp chung: sử dụng điện áp thấp','l',['Nơi nguy hiểm: điện áp không quá 36V; nơi đặc biệt nguy hiểm (phòng ẩm): đèn không quá 12V, hàn điện không quá 70V, hàn hồ quang không quá 12V','Đèn chiếu sáng chung nối lưới 127V và 220V chỉ dùng pha đặt ở độ cao cách mặt đất tối thiểu 2,5m; thấp hơn dùng đèn không quá 36V','Nguồn điện từ 36V trở xuống lấy từ máy biến áp, hạ áp, máy phát điện, bộ ắc quy','Không dùng biến áp giảm áp kiểu tự ngẫu làm nguồn cấp']],
[C5,'5.3.2','Làm cách điện dây dẫn: độ cao dây điện','s',['2,5|m|phía dưới là nơi làm việc','3,5|m|phía dưới là lối người đi lại','6,0|m|phía dưới có phương tiện cơ giới qua lại','6,5|m|phía dưới có tàu hoả qua lại','2|điểm|nối tối đa trong một khoảng cột']],
[C5,'5.3.2','Làm bộ phận che chắn','l',['Đặt các che chắn hoặc tách máy móc thiết bị nguy hiểm ra xa, ngoài khoảng cách AT; bộ phận che chắn có thể là vỏ đặc hoặc lỗ, lưới','Máy cắt điện tự động, cầu dao chuyển mạch và dụng cụ điện trên công trường phải có vỏ hộp bảo vệ','Phần dẫn điện của thiết bị điện phải được cách ly, có hàng rào che chắn, đặt nơi ít người qua lại']],
[C5,'5.3.2','Nối đất bảo vệ (mạng 3 pha cách ly, không có dây trung tính)','l',['Dùng dây dẫn nối vỏ kim loại với cọc nối đất bằng sắt thép chôn dưới đất có điện trở nhỏ và điện trở cách điện ở phần bị hư hỏng','Dòng điện rò mạng cách ly dưới 1000V không lớn quá 10A; nếu điện trở cực nối đất nhỏ (4Ω) thì điện áp chạm U = 10 × 4 = 40V','Người tiếp xúc coi như mắc song song với cực nối đất: In·Rn = Id·Rnd','In: dòng qua người (A); Id: dòng điện rò (A); Rn: điện trở người (Ω); Rnd: điện trở cực nối đất (Ω)']],
[C5,'5.3.2','Nối không và cắt điện bảo vệ','l',['Nối đất trong mạng có dây trung tính: nối thân kim loại của máy với dây trung tính; sự cố chạm vỏ thì dòng ngắn mạch làm cháy cầu chì hoặc bộ phận tự động cắt điện','Theo TCVN 4756-1989: sơ đồ TN-C, TN-C-S, TN-S','Cắt điện bảo vệ cắt điện nhanh trong khoảng 0,1 đến 0,2 giây khi điện áp đến mức quy định','Sử dụng điện cực san bằng thế trong mạng điện có điện áp đến 1000V; điện cực làm bằng thép tròn Φ6–Φ10, chôn sâu 0,3–0,5m']],
[C5,'5.3.2','Khoảng cách AT tránh phóng điện hồ quang & dụng cụ bảo vệ','l',['Bảng 5.2 – điện áp 6–15kV: 2m; 15–35kV: 3m; 35–110kV: 4m; 110–300kV: 6m','Dụng cụ bảo vệ chính: sàn cách điện, kìm cách điện, kìm đo điện, thiết bị chỉ điện áp dưới 1000V','Dụng cụ phụ trợ: găng tay và ủng cao su, thảm cách điện; đồng hồ hoặc kìm đo điện','Phải theo TCVN 5587-1991, 5588-1991, 5589-1991, 5589-1992, 5586-1992']],
[C5,'5.3.3','Yêu cầu AT điện trong xây dựng (a)','l',['Lưới động lực và chiếu sáng lắp thành hai hệ thống riêng biệt','Mạng điện có sơ đồ chỉ dẫn, cầu dao chung và cầu dao phân đoạn để cắt điện toàn bộ phụ tải điện trong phạm vi từng hạng mục','Dây dẫn điện treo mắc trên cột hoặc giá đỡ chắc chắn; dây trần treo cao tối thiểu 3,5m và 6,0m nơi có xe cộ','Máy, thiết bị thi công được bảo đảm an toàn điện']],
[C5,'5.3.3','Yêu cầu đối với công nhân vận hành thiết bị điện','l',['Được đào tạo về kỹ thuật điện và kỹ thuật AT điện, nội dung phù hợp công tác vận hành','Đủ sức khoẻ, không mắc bệnh về tim mạch, kiểm tra sức khoẻ định kỳ theo quy định của Bộ Y tế','Công nhân vận hành có tay nghề; trình độ kỹ thuật AT điện không thấp hơn bậc 2; công nhân trực trạm điện không thấp hơn bậc 3','Được trang bị phương tiện bảo vệ cá nhân, biết cấp cứu người bị điện giật; học và kiểm tra lại hàng năm']],

A(C4,'4.5.1','Mặt bằng thi công: kho bãi và xếp vật liệu',['Kho tàng bố trí trên mặt bằng phẳng, có lối thoát nước để bảo đảm sự ổn định của kho§Liên hệ chặt chẽ với công tác bốc dỡ, vận chuyển','Vật liệu ở bãi, kho lộ thiên như đá hộc, đá dăm, cuội sỏi, gạch, cát, thép hình, gỗ cây…§Nên cơ giới hoá khâu bốc dỡ và vận chuyển để giảm tai nạn','Nguyên vật liệu thành phẩm, bán thành phẩm trên công trường phải xếp gọn gàng, đúng nơi quy định§Không vứt bừa bãi, cản trở lối đi; bố trí từng khu vực riêng cho các vật liệu','Giữa các chồng vật liệu phải chừa lối đi cho người, rộng ít nhất 2m§Cấm xếp hàng trên các tuyến đường qua lại§Vật liệu xếp gần hố, hào, hành lang phải giữ khoảng cách an toàn tới mép theo quy định']),
A(C4,'4.5.1','Quy định xếp vật liệu (1): rời, bột, tấm, ống',['Vật liệu rời (cát, đá dăm, sỏi, xỉ…)§Đổ thành đống, mái dốc theo góc mái dốc tự nhiên','Vật liệu dạng bột (xi măng, thạch cao, vôi bột…)§Phải đóng bao hoặc chứa trong thùng kín, xilô, bunke','Tấm tường, tấm vách ngăn§Xếp trong khung giá để thẳng đứng hoặc giá chữ A, theo vị trí thẳng đứng','Ống thép đường kính ≤ 300mm§Xếp từng lớp không quá 2,5m, có cọc chống giữ chắc chắn','Ống thép đường kính > 300mm và ống gang§Xếp từng lớp không cao quá 2m, có cọc chống giữ chắc chắn']),
A(C4,'4.5.1','Quy định xếp vật liệu (2): dầm, gỗ, kính, độc hại',['Dầm xếp một lớp theo vị trí làm việc§Có gỗ đệm, đặt cạnh nhau; vị trí gỗ đệm không quá 1/5 chiều dài dầm tính từ hai đầu','Gỗ cây xếp chồng có kê dưới, không cao quá 1,5m§Chiều cao chồng gỗ phải nhỏ hơn chiều rộng và có cọc giữ hai bên§Gỗ xẻ xếp chồng không cao quá 1,2m','Kính đóng hòm§Đặt trong khung thẳng đứng, chỉ xếp một lớp, không chồng lên nhau','Nguyên vật liệu độc hại, dễ cháy nổ§Phải chứa trong các kho riêng§Bảo đảm khoảng cách an toàn cháy – nổ tới khu vực thi công và các công trình xung quanh'])]);
ins('Mặt bằng thi công: lưới điện trên công trường',[
A(C4,'4.5.1','Mặt bằng thi công: các yêu cầu bổ sung',['Làm hệ thống chống sét cho giàn giáo kim loại và các công trình độc lập như trụ đèn pha, công trình có chiều cao lớn','Khi làm việc trên cao hoặc xuống sâu phải có đồ án nêu rõ biện pháp đưa công nhân lên xuống và hệ thống bảo vệ','Trên bình đồ xây dựng phải chỉ rõ nơi dễ gây hoả hoạn, đường đi qua và đường thoát người; bố trí chi tiết vị trí các công trình phòng hoả','Bố trí nhà cửa tạm theo tiêu chuẩn phòng cháy'])]);
ins('Thiết kế và bố trí mặt bằng công trường (b–c)',[
A(C4,'4.5.2','Thiết kế và bố trí mặt bằng công trường (d)',['Nguyên nhân sau cùng gây tai nạn: mặt bằng thiết kế và bố trí không ngăn nắp, vật liệu rơi, va chạm giữa công nhân với máy móc, thiết bị','Làn đường cho phương tiện giao thông: tốt nhất là bố trí một chiều; tắc nghẽn giao thông dễ gây mất an toàn cho công nhân','Bố trí phân xưởng làm việc: thường không di chuyển cho đến khi xây dựng xong','Trang bị y tế và chăm sóc; ánh sáng nhân tạo nơi làm việc liên tục hoặc khi trời tối','Sử dụng dòng điện hạ thế cho chiếu sáng tạm thời và các thiết bị cầm tay; cần tập huấn cho công nhân']),
A(C4,'4.5.2','Sự ngăn nắp của công trường: các bước đảm bảo',['Làm vệ sinh trước khi nghỉ§Không để rác hay phó mặc cho người sau dọn','Cất dọn vật liệu, thiết bị chưa cần dùng ngay§Khỏi lối đi, cầu thang và nơi làm việc','Lau sạch dầu và nhớt, bôi trơn','Vứt phế liệu vào chỗ quy định','Nhổ hoặc đập bẹp các đinh nhọn dựng ngược ở các ván cốt pha§Nhiều tai nạn xảy ra do bước hụt, vấp ngã, trượt ngã hoặc ngã vào vật liệu, thiết bị nằm lộn xộn khắp nơi'])]);
ins('Nguyên nhân gây tai nạn điện (2)',[
A(C5,'5.3.1','Nguyên nhân gây tai nạn điện (3): điện áp an toàn',['Vì sao tai nạn nhiều ở thiết bị dưới 1000V§Dùng rộng rãi trong công nghiệp và người sử dụng không được đào tạo cẩn thận§Thiết bị trên 1000V chỉ cho phép thợ điện tay nghề bậc cao','Điện trở cơ thể người không ổn định và có thể thay đổi trong giới hạn rộng§Muốn hạn chế dòng điện chạy qua người chỉ có cách giảm trị số điện áp đặt lên nó','Trị số không nguy hiểm của điện áp§Là trị số mà với nó dòng điện chạy qua người sẽ không nguy hiểm','Yêu cầu an toàn điện trong căn nhà§Phụ thuộc vào đặc trưng của môi trường xung quanh'])]);
ins('Làm bộ phận che chắn',[
A(C5,'5.3.2','Đường cáp mềm, cáp qua đường và nổ mìn',['Đường cáp mềm trong công trường cấp điện cho máy móc, thiết bị di động hoặc cấp điện tạm thời phải có biện pháp bảo vệ','Cáp nằm ngang đường có xe cộ chạy qua§Treo cáp lên cao hoặc luồn cáp trong ống thép, máng thép hình và chôn trong đất','Cáp nằm trong khu vực nổ mìn§Trước khi nổ mìn phải ngắt điện đường cáp','Sau khi nổ mìn§Phải kiểm tra, phát hiện những chỗ hư hỏng và sửa chữa trước khi đóng điện trở lại cho đường cáp'])]);
ins('Nối không và cắt điện bảo vệ',[
A(C5,'5.3.2','Điện cực san bằng thế và vùng điện áp bước',['Khi có dây điện đứt, một đầu rơi xuống đất, ruộng, ao… mọi người phải tránh xa','Nối đất thiết bị trên 1000V§Dòng chạm đất lớn đi vào đất qua bộ phận nối đất; người đi vào vùng này sẽ chịu điện áp bước§Xung quanh bộ phận nối đất phải được rào ngăn lại','San bằng thế: trước hết nên dùng nối đất tự nhiên§Nối vỏ kim loại thiết bị với kết cấu kim loại có sẵn như bệ máy, cột sắt, đường ray, đường ống','Nếu chưa bảo đảm trị số điện áp chạm: đặt thêm điện cực san bằng thế nhân tạo§Đặt xung quanh thiết bị điện, tạo thành một lưới; điện áp chạm yêu cầu nhỏ hơn 42V','Điện cực làm bằng thép tròn Φ6–Φ10 hoặc dây đồng§Chôn sâu 0,3–0,5m, nối thiết bị vào lưới từ 2 đến 3 điểm'])]);
ins('Tác hại của sét',[
A(C5,'5.4.1','Tác hại của sét (1): tác hại trực tiếp',['Cường độ dòng sét đến 200.000A; điện áp hàng chục triệu vôn; nhiệt độ tia chớp 6.000–10.000°C; chiều dài tia chớp 100–1.000m','Sét phá huỷ bề mặt cơ học của mặt đất; có thể nổ tung các tháp cao, cây cối, đường dây điện','Dòng sét có nhiệt độ rất lớn gây đám cháy lớn§Rất nguy hiểm đối với kho tàng, đặc biệt kho nhiên liệu và vật liệu nổ','Tác hại trực tiếp: tia sét đánh thẳng vào công trình§Gây hư hỏng cơ học (đổ, vỡ), nhiệt độ cao làm cháy công trình và nổ vật liệu chứa bên trong']),
A(C5,'5.4.1','Tác hại của sét (2): tác hại gián tiếp',['Tia chớp ở xa công trình gây tác hại gián tiếp§Gây cảm ứng tĩnh điện và cảm ứng điện từ','Sét thấm nhập điện thế cao§Theo đường dây điện trên không, đường dây thông tin, đường ống hoặc cáp ngầm nằm gần dây tiếp địa của cột thu sét§Điện thế cao thấm nhập vào nhà có thể phóng điện vào các vật bên trong gây cháy nhà','Nguy hiểm cho người§Nếu trong thời điểm phóng sét mà người chạm vào chi tiết mang điện áp tiếp xúc hoặc đứng gần dây tiếp địa của cột thu sét (điện áp bước)'])]);
ins('Phân cấp chống sét theo bảng 5.3',[
A(C5,'5.4.1','Chống sét cho kho vật liệu nổ công nghiệp (VLNCN)',['Kho chứa VLNCN, nhà để sấy, nghiền, đóng bao, nhà để chuẩn bị VLNCN đều xếp vào cấp I§Nhà cấp I đặt lộ thiên hoặc bán ngầm đều phải bảo vệ tránh cả tác dụng trực tiếp lẫn gián tiếp của sét','Phương tiện vận tải thuỷ chở VLNCN phải được trang bị chống sét','Cấm đặt thiết bị thu sét trực tiếp trên nhà kho và các nhà nêu trên; cấm mắc đường dây điện trên không vào các thiết bị thu sét','Kho bảo quản VLNCN đặt ở địa phương ít sét vẫn phải được bảo vệ chống sét với độ tin cậy như nhau','Công trình đặc biệt (kho vật liệu nổ, kho xăng dầu…) phải theo quy định chuyên ngành, ví dụ TCVN 4586-1997'] ),
A(C5,'5.4.1','Chống cảm ứng tĩnh điện',['Khi nhà và công trình đặc biệt có kết cấu kim loại kích thước dài, hoặc VLNCN chứa trong hòm kim loại: phải có biện pháp chống cảm ứng tĩnh điện','Biện pháp 1: tiếp đất tất cả các vật thể, thiết bị kim loại có trong nhà','Biện pháp 2: đặt lưới kim loại trên mái nhà, ô lưới không quá 10m×10m (sắt Φ5–6mm) rồi nối xuống đất phía ngoài nhà§Cách móng nhà 0,5–1,0m, sâu 0,8m, cách xa bộ phận tiếp đất của thu sét đánh thẳng 3m','Điện trở nối đất không được quá 5Ω§Để giảm điện trở có thể nối bộ phận tiếp đất với đường ống kim loại (ống dẫn nước) chôn ngầm dưới nước']),
A(C5,'5.4.1','Chống cảm ứng điện từ',['Nối tất cả đường ống, cáp điện bọc thép dẫn đến công trình và các kết cấu kim loại trong công trình thành một mạch kín','Nếu bố trí chéo nhau thì nối ở chỗ gần nhất; nếu đi song song thì cứ 15–20m có một điểm nối','Các mối nối phải bảo đảm dẫn điện tốt','Nếu ở khớp nối có nghi ngờ tiếp xúc không tốt: giữa hai bộ phận được nối phải có một dây dẫn phụ bằng thép hoặc đồng, tiết diện 16–25mm²']),
A(C5,'5.4.1','Chống thấm nhập điện thế cao vào nhà kho VLNCN',['Không được đưa đường dây trên không vào thẳng nhà kho§Trường hợp thật cần thiết, khi gần vào nhà kho phải dùng một đoạn cáp ngầm dài ít nhất 100m','Chỗ chuyển từ đường dây trên không xuống cáp ngầm§Phải đặt bộ phận chống sét kiểu van§Đặt tiếp đất có điện trở không lớn hơn 5Ω; chân sứ của 2 cột gần chỗ chuyển cũng phải tiếp đất, điện trở không lớn hơn 10Ω','Máy điện thoại, tín hiệu nối với đường dây trên không§Phải đặt ngoài nhà kho; vỏ máy tiếp đất với điện trở không lớn hơn 10Ω','Cấp điện bằng đường cáp ngầm; cáp dẫn điện vào nhà kho phải đặt xa bộ phận tiếp đất của thu sét§Vỏ cáp nối với bộ phận tiếp đất để chống tác dụng gián tiếp của sét'])]);
ins('Bảo vệ chống sét: cột thu lôi và vùng bảo vệ',[
A(C5,'5.4.2','Vùng bảo vệ của thu lôi (1): cột đơn và hai cột',['Biện pháp chống sét đánh thẳng vào công trình là làm thu lôi chống sét§Gồm phần thu sét, dây dẫn sét và cực nối đất','Muốn bảo vệ thì toàn bộ công trình phải nằm trong vùng bảo vệ của thiết bị thu sét','Cột thu lôi đơn: vùng bảo vệ là hình nón có đường sinh là đường gãy khúc','Hai cột cùng chiều cao h, cách nhau a§Phần hai bên xác định như cột đơn§Phần giữa là vòng cung tròn đi qua hai đỉnh cột và tâm điểm giữa']),
A(C5,'5.4.2','Vùng bảo vệ của thu lôi (2): nhiều cột, khác độ cao',['Dùng hai hay nhiều cột thu lôi có độ cao không lớn thay cho một cột quá cao§Để bảo vệ công trình có mặt bằng lớn hoặc cụm công trình','Vùng bảo vệ giữa hai cột chỉ có tác dụng khi khoảng cách a nhỏ hơn 5 lần chiều cao h§Nếu a > 5h thì không còn vùng bảo vệ tương hỗ, hai cột làm việc như hai cột thu lôi độc lập','Hai cột khác chiều cao h1 và h2§Vẽ vùng bảo vệ từng cột§Từ đỉnh cột thấp kẻ đường nằm ngang cắt đường sinh hình nón của cột cao tại K; coi K như đỉnh cột thu lôi tương ứng'])]);
ins('Thiết kế các bộ phận của cột thu lôi',[
A(C5,'5.4.2','Phần thu sét và dây dẫn sét',['Phần thu sét làm bằng thanh, dây, lưới hoặc kết hợp§Thanh, dây đặt trên trụ đứng độc lập hoặc trụ đặt trên công trình','Lưới thu sét đặt hoặc treo trên mái công trình§Nối với cọc nối đất qua dây dẫn sét ít nhất ở hai chỗ; dây Φ6–10mm, mắt lưới 5×5m','Tiết diện đầu thu không nhỏ hơn 100mm²§Thép tròn 12mm, thép vuông 10×10mm, thép tấm 35×3mm, thép góc 20×3mm; hoặc ống thép Φ18–25mm có đầu dẹt hình côn','Đầu thu sét và dây dẫn đặt dọc theo cột đỡ§Chiều dài đầu thu không cao quá 1–1,5m so với đầu cột','Dây dẫn sét tiết diện không nhỏ hơn 50mm²; các phần dẫn điện nối với nhau bằng cách hàn§Trường hợp đặc biệt mới nối bằng đinh tán hay bu lông (ít nhất 2 đinh hoặc 2 bu lông)']),
A(C5,'5.4.2','Bộ phận tiếp đất và điện trở xung',['Bộ phận tiếp đất (nối đất) là tất cả các vật thể bằng kim loại chôn trong đất (thép ống, thép tấm) được nối trực tiếp với dây dẫn sét','Mỗi bộ phận tiếp đất có điện trở xung khác nhau§Điện trở xung Ri là điện trở của bộ phận tiếp đất khi có dòng điện sét đi qua','Điện trở xung khác về cơ bản so với điện trở đo bằng phương pháp thông thường§Vì dòng điện sét có trị số rất lớn, tác dụng trong khoảnh khắc làm giảm hiệu ứng điện thế trên chiều dài bộ phận tiếp đất và giảm hiệu quả dẫn điện của các phần ở xa dây dẫn sét'])]);
})();
