<!doctype html><html lang="vi"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Scene 4 · Trước và sau</title><style>body{background:#090c13;color:#e5dccd;margin:4vw;font:16px/1.6 system-ui}h1,h2{font-family:Georgia;font-weight:400}h1{font-size:40px}a{color:#d8b780}.pair{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:35px}img{width:100%;display:block}figure{margin:0}figcaption{margin:8px 0;color:#c4ad89}.phones{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;max-width:1000px} @media(max-width:750px){.pair{grid-template-columns:1fr}.phones{grid-template-columns:1fr}}</style><h1>Scene 4 — The archives of reform</h1><p>Ba hồ sơ lịch sử có gáy, bìa và cạnh giấy. Minh họa nghệ thuật riêng; nội dung lịch sử giữ nguyên.</p><p><a href="../../dist/reforming_vietnam_complete.html">Mở bài trình chiếu</a> · <a href="REVIEW.md">Ý tưởng, file đã sửa và giới hạn kiểm chứng</a></p><main id="gallery"></main><h2>Điện thoại — cả ba beat</h2><div class="phones" id="phones"></div><script>for(let i=0;i<3;i++){const h=document.createElement('h2');h.textContent=['Beat 1 · 1986 — Đổi Mới','Beat 2 · 2017 — Organisational renewal','Beat 3 · 2025 — Local government reform'][i];gallery.append(h);const row=document.createElement('div');row.className='pair';for(const phase of ['before','after']){const f=document.createElement('figure'),im=document.createElement('img'),cap=document.createElement('figcaption');im.src=phase+'/desktop-'+i+'.png';im.alt=phase+' beat '+(i+1);cap.textContent=phase==='before'?'Trước':'Sau · WebGL';f.append(im,cap);row.append(f);}gallery.append(row);const im=document.createElement('img');im.src='after/portrait-'+i+'.png';im.alt='Portrait beat '+(i+1);phones.append(im);}</script></html>
