<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Đồng Nai: vị trí địa lí và môi trường đầu tư</title>
<meta name="theme-color" content="#06161F">
<meta name="description" content="Bài trình chiếu về vị trí địa lí và môi trường đầu tư của Đồng Nai, có vòng quay chọn bạn trả lời câu hỏi.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ============ TOKENS ============ */
:root{
 --u:min(1vw,1.7778vh);
 --ink:#0C2B3A;--ink2:#476170;--river:#0A6C8F;--riverd:#07495F;--basalt:#B5361E;--ember:#E9693F;--lamp:#FFB627;--leaf:#2E7D4F;--night:#06161F;
 --f-d:"Barlow Condensed","Roboto Condensed","Arial Narrow","Segoe UI",system-ui,sans-serif;
 --f-b:"Be Vietnam Pro","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
 --ease:cubic-bezier(.2,.7,.2,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#03090D}
body{font-family:var(--f-b);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
a{color:inherit}ol,ul{list-style:none}
svg.ic{width:1em;height:1em;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
:focus-visible{outline:calc(var(--u)*.22) solid var(--lamp);outline-offset:calc(var(--u)*.2)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ============ STAGE ============ */
#stage{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:calc(var(--u)*100);height:calc(var(--u)*56.25);font-size:var(--u);overflow:hidden;background:var(--night);isolation:isolate;color:#EAF0F2;-webkit-user-select:none;user-select:none}
#deck,.sl{position:absolute;inset:0}
.sl{display:none;overflow:hidden;background:var(--bg);color:var(--fg)}
.sl.act{display:block}
.day{--bg:#E9F0F2;--fg:var(--ink);--mut:var(--ink2);--line:rgba(12,43,58,.16);--cn:rgba(10,108,143,.11);--pn:#fff}
.night{--bg:radial-gradient(120% 90% at 20% 108%,#14405A 0,#0B2433 46%,#06161F 100%);--fg:#EAF0F2;--mut:#93AEBB;--line:rgba(255,255,255,.15);--cn:rgba(255,255,255,.055);--pn:rgba(255,255,255,.07)}
.dusk{--bg:linear-gradient(140deg,#0B7BA3 0,#07495F 50%,#0A2A3A 100%);--fg:#F4FAFC;--mut:#BFE0EA;--line:rgba(255,255,255,.24);--cn:rgba(255,255,255,.11);--pn:rgba(255,255,255,.1)}
.bgc{position:absolute;left:-10%;top:-12%;width:120%;height:124%;color:var(--cn);pointer-events:none}
.bgc path{fill:none;stroke:currentColor;stroke-width:1.3;vector-effect:non-scaling-stroke}
.act .bgc{animation:drift 38s ease-in-out infinite alternate}
@keyframes drift{from{transform:translate(0,0) scale(1)}to{transform:translate(-2.2%,1.6%) scale(1.045)}}
.fit{white-space:nowrap}

/* ============ CHROME ============ */
#hud{position:absolute;left:0;right:0;bottom:calc(var(--u)*1.1);height:calc(var(--u)*3.4);z-index:8;display:flex;align-items:center;gap:calc(var(--u)*2);padding:0 calc(var(--u)*6);pointer-events:none;transition:opacity .5s,color .5s;color:var(--hf,#fff)}
#hud.off{opacity:0}
#hud .hl{width:calc(var(--u)*19);font-size:calc(var(--u)*1.3);font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#hud .hr{width:calc(var(--u)*8);text-align:right;font:700 calc(var(--u)*1.5)/1 var(--f-d);opacity:.8}
.route{position:relative;flex:1;height:100%;display:flex;justify-content:space-between;align-items:center}
.route::before{content:"";position:absolute;left:0;right:0;top:50%;height:calc(var(--u)*.16);margin-top:calc(var(--u)*-.08);background:var(--hm,rgba(255,255,255,.28))}
.route .fill{position:absolute;left:0;top:50%;height:calc(var(--u)*.16);margin-top:calc(var(--u)*-.08);background:var(--hf,var(--lamp));width:0;transition:width .9s var(--ease)}
.stn{position:relative;pointer-events:auto;width:calc(var(--u)*2.4);height:calc(var(--u)*3.4);display:grid;place-items:center}
.stn i{width:calc(var(--u)*.9);height:calc(var(--u)*.9);border-radius:50%;background:var(--hb,#06161F);border:calc(var(--u)*.2) solid var(--hm,rgba(255,255,255,.5));transition:all .5s var(--ease)}
.stn.done i{background:var(--hf,var(--lamp));border-color:var(--hf,var(--lamp))}
.stn.cur i{width:calc(var(--u)*1.55);height:calc(var(--u)*1.55);background:var(--hf,var(--lamp));border-color:var(--hb,#06161F);box-shadow:0 0 0 calc(var(--u)*.22) var(--hf,var(--lamp))}
#stage[data-th=day]{--hf:var(--ink);--hm:rgba(12,43,58,.22);--hb:#E9F0F2}
#stage[data-th=night]{--hf:var(--lamp);--hm:rgba(255,255,255,.26);--hb:#0A1F2C}
#stage[data-th=dusk]{--hf:#fff;--hm:rgba(255,255,255,.34);--hb:#0A5E7C}
#ctl{position:absolute;right:calc(var(--u)*2.2);top:calc(var(--u)*1.1);z-index:9;display:flex;gap:calc(var(--u)*.6);opacity:.5;transition:opacity .3s}
#ctl:hover,#ctl:focus-within{opacity:1}
#ctl.idle{opacity:0}
#ctl button{width:calc(var(--u)*3.1);height:calc(var(--u)*3.1);border-radius:50%;display:grid;place-items:center;font-size:calc(var(--u)*1.65);background:rgba(0,0,0,.3);color:#fff;transition:background .2s}
#ctl button:hover{background:rgba(0,0,0,.55)}
#stage[data-th=day] #ctl button{background:rgba(12,43,58,.1);color:var(--ink)}
#stage[data-th=day] #ctl button:hover{background:rgba(12,43,58,.2)}
.edge{position:absolute;top:18%;bottom:14%;width:calc(var(--u)*4);z-index:7;display:grid;place-items:center;font-size:calc(var(--u)*2.4);color:#fff;opacity:0;transition:opacity .25s;background:linear-gradient(90deg,rgba(0,0,0,.25),transparent)}
.edge.r{right:0;background:linear-gradient(270deg,rgba(0,0,0,.25),transparent)}.edge.l{left:0}
.edge:hover{opacity:.9}
#stage[data-th=day] .edge{color:var(--ink);background:linear-gradient(90deg,rgba(12,43,58,.12),transparent)}
#stage[data-th=day] .edge.r{background:linear-gradient(270deg,rgba(12,43,58,.12),transparent)}
#fx{position:absolute;inset:0;width:100%;height:100%;z-index:30;pointer-events:none}
#toast{position:absolute;left:50%;bottom:calc(var(--u)*7);transform:translate(-50%,calc(var(--u)*1));z-index:60;padding:.7em 1.4em;border-radius:99em;background:rgba(6,22,31,.92);color:#fff;font-size:calc(var(--u)*1.4);font-weight:600;opacity:0;pointer-events:none;transition:all .3s var(--ease);white-space:nowrap;border:1px solid rgba(255,255,255,.18)}
#toast.show{opacity:1;transform:translate(-50%,0)}

/* ============ GATE ============ */
#gate{position:absolute;inset:0;z-index:50;display:grid;place-items:center;background:radial-gradient(90% 90% at 50% 100%,#12384B 0,#06161F 70%);color:#EAF0F2;text-align:center;transition:opacity .7s,visibility .7s}
#gate.gone{opacity:0;visibility:hidden}
#gate .gi{display:grid;justify-items:center;gap:calc(var(--u)*2)}
#gate h1{font:800 calc(var(--u)*9)/.9 var(--f-d)}
#gate p{font-size:calc(var(--u)*1.6);color:#93AEBB;max-width:calc(var(--u)*50);line-height:1.5}
.go{display:inline-flex;align-items:center;gap:.7em;padding:.8em 1.7em .8em 1.3em;border-radius:99em;background:var(--lamp);color:#1B1300;font-weight:800;font-size:calc(var(--u)*1.9);box-shadow:0 .35em 1.8em rgba(255,182,39,.38);transition:transform .2s var(--ease),box-shadow .2s}
.go:hover{transform:translateY(-.1em);box-shadow:0 .5em 2.2em rgba(255,182,39,.5)}
.go .ic{font-size:1.15em}
.go.ghost{background:rgba(255,255,255,.1);color:#fff;box-shadow:none;border:1px solid rgba(255,255,255,.25);font-weight:600}
#gate .pulse{position:relative}
#gate .pulse::before{content:"";position:absolute;inset:-.5em;border-radius:99em;border:2px solid var(--lamp);opacity:0;animation:pulse 2.2s ease-out infinite}
@keyframes pulse{0%{transform:scale(.9);opacity:.8}100%{transform:scale(1.25);opacity:0}}

/* ============ INTRO ============ */
.intro{background:#030A10}
.in-sky{position:absolute;inset:0;background:
 radial-gradient(1.5px 1.5px at 8% 12%,#fff,transparent),radial-gradient(1px 1px at 18% 30%,#cfe,transparent),radial-gradient(1.5px 1.5px at 31% 8%,#fff,transparent),radial-gradient(1px 1px at 44% 22%,#fff,transparent),radial-gradient(1.5px 1.5px at 63% 10%,#fff,transparent),radial-gradient(1px 1px at 76% 26%,#cfe,transparent),radial-gradient(1.5px 1.5px at 90% 14%,#fff,transparent),radial-gradient(1px 1px at 55% 34%,#fff,transparent),
 linear-gradient(180deg,#02070B 0,#06202D 52%,#10394B 57%,#041019 57.2%,#02080D 100%)}
.in-sky::after{content:"";position:absolute;left:0;right:0;top:50%;height:calc(var(--u)*9);background:radial-gradient(50% 100% at 50% 100%,rgba(255,182,39,.28),transparent 70%)}
.runway{position:absolute;left:0;bottom:0;width:100%;height:100%}
.runway circle{fill:#EAF6FF;opacity:.16}
.runway circle.e{fill:#FFC85A}
.in .runway circle{animation:chase 1.7s linear infinite;animation-delay:calc(var(--i)*70ms)}
@keyframes chase{0%,100%{opacity:.14}8%{opacity:1}22%{opacity:.14}}
.in-c{position:absolute;inset:0;display:grid;align-content:center;justify-items:center;gap:calc(var(--u)*1.6);padding-bottom:calc(var(--u)*4)}
.in-k,.in-s,.in-f{opacity:0;font-size:calc(var(--u)*1.9);color:#B8D2DD;transition:opacity .9s var(--ease),transform .9s var(--ease);transform:translateY(calc(var(--u)*1))}
.in-s{font-size:calc(var(--u)*2.1)}
.in-f{font-size:calc(var(--u)*1.55);color:#8FB0BF}
.in-k.on,.in-s.on,.in-f.on{opacity:1;transform:none}
.flap{display:flex;gap:calc(var(--u)*.7);align-items:center;min-height:calc(var(--u)*8.4)}
.fl{position:relative;width:calc(var(--u)*5.3);height:calc(var(--u)*8.2);display:grid;place-items:center;border-radius:calc(var(--u)*.6);background:linear-gradient(#12384A 0 49.4%,#0B2330 50.6% 100%);font:800 calc(var(--u)*6.6)/1 var(--f-d);color:#F4FAFC;box-shadow:inset 0 0 0 1px rgba(255,255,255,.09),0 calc(var(--u)*.7) calc(var(--u)*1.8) rgba(0,0,0,.55);opacity:0;transform:translateY(calc(var(--u)*1.2)) scale(.94);transition:opacity .5s,transform .6s var(--ease)}
.fl.on{opacity:1;transform:none}
.fl::after{content:"";position:absolute;left:0;right:0;top:50%;height:2px;margin-top:-1px;background:rgba(0,0,0,.6)}
.fl.sp{width:calc(var(--u)*2.2);background:none;box-shadow:none}.fl.sp::after{display:none}
.fl.ch{animation:fp .11s steps(2)}
@keyframes fp{50%{transform:scaleY(.12)}}
.fl.fin{color:#FFD27A}
.pass{position:relative;width:calc(var(--u)*58);display:grid;gap:calc(var(--u)*.5);padding:calc(var(--u)*1.4) calc(var(--u)*2) calc(var(--u)*1.4) calc(var(--u)*2.4);border-radius:calc(var(--u)*1.2);background:rgba(7,26,38,.8);border:1px solid rgba(255,255,255,.16);backdrop-filter:blur(6px);opacity:0;transform:translateY(calc(var(--u)*2.5)) scale(.98);transition:opacity .8s var(--ease),transform .9s var(--ease);margin-top:calc(var(--u)*.8)}
.pass.on{opacity:1;transform:none}
.pass::before,.pass::after{content:"";position:absolute;left:calc(var(--u)*-.8);top:50%;width:calc(var(--u)*1.6);height:calc(var(--u)*1.6);margin-top:calc(var(--u)*-.8);border-radius:50%;background:#030A10}
.pass::after{left:auto;right:calc(var(--u)*-.8)}
.pr{display:grid;grid-template-columns:calc(var(--u)*8.5) 1fr auto;align-items:center;gap:calc(var(--u)*1.2);min-height:calc(var(--u)*3.6)}
.pr .pl{font-size:calc(var(--u)*1.35);color:#8FB0BF;font-weight:600}
.pr .pv{font:700 calc(var(--u)*2.5)/1.1 var(--f-b);color:#fff;text-decoration:none;word-break:break-all}
.pr a.pv{color:#FFD27A}
.pr a.pv:hover{text-decoration:underline}
.cpb{width:calc(var(--u)*3);height:calc(var(--u)*3);border-radius:50%;display:grid;place-items:center;font-size:calc(var(--u)*1.5);background:rgba(255,255,255,.1);color:#fff}
.cpb:hover{background:rgba(255,255,255,.22)}
.caret::after{content:"";display:inline-block;width:.08em;height:1em;margin-left:.12em;vertical-align:-.12em;background:var(--lamp);animation:blink .8s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
.in-go{position:absolute;left:50%;bottom:calc(var(--u)*6.4);transform:translateX(-50%);opacity:0;pointer-events:none;transition:opacity .8s;overflow:hidden}
.in-go.on{opacity:1;pointer-events:auto}
.in-go i{position:absolute;left:0;bottom:0;height:.28em;width:100%;background:rgba(27,19,0,.35);transform-origin:left;transform:scaleX(0)}
.in-go.run i{animation:fillbar 6.5s linear forwards}
@keyframes fillbar{to{transform:scaleX(1)}}
.in-skip{position:absolute;right:calc(var(--u)*3);bottom:calc(var(--u)*3.2);z-index:3;font-size:calc(var(--u)*1.3);font-weight:600;color:#B8D2DD;padding:.5em 1em;border-radius:99em;border:1px solid rgba(255,255,255,.2)}
.in-skip:hover{background:rgba(255,255,255,.1)}

/* ============ TITLE ============ */
.tt{padding:0 calc(var(--u)*7)}
.tt-k{position:absolute;left:calc(var(--u)*7);top:calc(var(--u)*4.4);font-size:calc(var(--u)*1.7);font-weight:600;color:var(--mut)}
.tt-h{position:absolute;left:calc(var(--u)*6.4);top:calc(var(--u)*9.4);width:calc(var(--u)*88);font:800 calc(var(--u)*21)/.9 var(--f-d);letter-spacing:-.012em;color:#fff;text-shadow:0 calc(var(--u)*.4) calc(var(--u)*2) rgba(0,0,0,.18)}
.tt-s{position:absolute;left:calc(var(--u)*7);top:calc(var(--u)*31.2);font-size:calc(var(--u)*3.4);font-weight:700;max-width:calc(var(--u)*86);line-height:1.2}
.tt-n{position:absolute;left:calc(var(--u)*7);top:calc(var(--u)*36.8);font-size:calc(var(--u)*1.65);color:var(--mut);display:flex;gap:.6em;align-items:center}
.agenda{position:absolute;left:calc(var(--u)*5);right:calc(var(--u)*5);bottom:calc(var(--u)*4.2);display:grid;grid-template-columns:repeat(10,1fr);border-top:1px solid var(--line)}
.agenda li{padding:calc(var(--u)*1.1) calc(var(--u)*.5) 0 calc(var(--u)*1);position:relative;opacity:0;animation:ag .8s var(--ease) both;animation-delay:calc(.4s + var(--i)*.07s)}
.agenda li::before{content:"";position:absolute;left:calc(var(--u)*1);top:calc(var(--u)*-.45);width:calc(var(--u)*.9);height:calc(var(--u)*.9);border-radius:50%;background:#fff}
.agenda b{display:block;font-size:calc(var(--u)*1.28);font-weight:700;line-height:1.2}
.agenda span{display:block;font-size:calc(var(--u)*1.12);color:var(--mut);line-height:1.25;margin-top:.2em}
@keyframes ag{from{opacity:0;transform:translateY(calc(var(--u)*1))}to{opacity:1;transform:none}}

/* ============ CHAPTER ============ */
.cp .no{position:absolute;left:calc(var(--u)*7);top:calc(var(--u)*6);display:flex;align-items:center;gap:.6em;font-size:calc(var(--u)*2.1);font-weight:700;color:var(--mut)}
.cp .by{position:absolute;left:calc(var(--u)*7);top:calc(var(--u)*30.4);display:flex;align-items:baseline;gap:.7em;font-size:calc(var(--u)*2);color:var(--mut)}
.cp .by b{font-size:1.3em;color:#fff;font-weight:700}
.cp h1{position:absolute;left:calc(var(--u)*6.4);top:calc(var(--u)*10.5);width:calc(var(--u)*88);font:800 calc(var(--u)*19)/.9 var(--f-d);letter-spacing:-.012em;color:#fff}
.lanes{position:absolute;left:calc(var(--u)*7);right:calc(var(--u)*7);bottom:calc(var(--u)*9);display:grid;grid-template-columns:1fr 1fr;gap:calc(var(--u)*5)}
.lane{display:grid;grid-template-columns:calc(var(--u)*6.2) 1fr;column-gap:calc(var(--u)*1.8);align-items:center;position:relative;padding-bottom:calc(var(--u)*2.4)}
.lane .bd{width:calc(var(--u)*6.2);height:calc(var(--u)*6.2);border-radius:50%;display:grid;place-items:center;font-size:calc(var(--u)*3);background:#fff;color:var(--river);opacity:0;transform:scale(.6)}
.lane.inv .bd{color:var(--basalt)}
.lane h3{font-size:calc(var(--u)*2.7);font-weight:700;line-height:1.1;opacity:0}
.lane p{font-size:calc(var(--u)*1.45);color:var(--mut);margin-top:.25em;opacity:0}
.lane .ln{position:absolute;left:0;bottom:0;width:100%;height:calc(var(--u)*.3);border-radius:99em;background:#fff;transform-origin:left;transform:scaleX(0)}
.lane.inv .ln{background:#FFB48F}
.cp.play .lane .ln{animation:dline 1.5s var(--ease) .9s forwards}
.cp.play .lane.inv .ln{animation-delay:1.25s}
.cp.play .lane .bd{animation:pop .7s var(--ease) .55s forwards}
.cp.play .lane.inv .bd{animation-delay:.9s}
.cp.play .lane h3,.cp.play .lane p{animation:fi .7s var(--ease) .8s forwards}
.cp.play .lane.inv h3,.cp.play .lane.inv p{animation-delay:1.15s}
.cp.play h1 .w{animation:rise .9s var(--ease) both;animation-delay:calc(.1s + var(--i)*.05s)}
.cp h1 .w{display:inline-block;opacity:0}
@keyframes dline{to{transform:scaleX(1)}}
@keyframes pop{to{opacity:1;transform:none}}@keyframes fi{to{opacity:1}}
@keyframes rise{from{opacity:0;transform:translateY(.28em)}to{opacity:1;transform:none}}

/* ============ INFO ============ */
.info.geo{--tc:var(--river);--tcs:rgba(10,108,143,.075)}
.info.inv{--tc:var(--basalt);--tcs:rgba(181,54,30,.07)}
.ih{position:absolute;left:calc(var(--u)*6);right:calc(var(--u)*6);top:calc(var(--u)*3.6);display:flex;align-items:flex-start;justify-content:space-between;gap:calc(var(--u)*2)}
.ih>div:first-child{flex:1 1 0;min-width:0}
.by{flex:none}
.tag{display:inline-flex;align-items:center;gap:.55em;padding:.55em 1.2em .55em .85em;border-radius:99em;background:var(--tc);color:#fff;font-weight:700;font-size:calc(var(--u)*1.45);line-height:1}
.tag .ic{font-size:1.25em}
.ih h2{font:800 calc(var(--u)*5.8)/.95 var(--f-d);margin-top:calc(var(--u)*1.1);letter-spacing:-.005em}
.by{text-align:right;font-size:calc(var(--u)*1.4);color:var(--mut);white-space:nowrap;padding-top:calc(var(--u)*3)}
.by b{display:block;font-size:1.3em;color:var(--fg);font-weight:700;margin-top:.1em}
.rows{position:absolute;left:calc(var(--u)*6);right:calc(var(--u)*6);top:calc(var(--u)*14.6);bottom:calc(var(--u)*7.6);display:grid;grid-auto-rows:auto;align-content:space-between}
.row{display:grid;grid-template-columns:calc(var(--u)*18) 1fr;align-items:center;column-gap:calc(var(--u)*2);padding:calc(var(--u)*.7) calc(var(--u)*2) calc(var(--u)*.7) 0;box-shadow:0 1px 0 var(--line);border-left:calc(var(--u)*.55) solid var(--tc);background:linear-gradient(90deg,var(--tcs),transparent 75%);opacity:0;clip-path:inset(0 100% 0 0)}
.row.on{opacity:1;clip-path:inset(0 0 0 0);transition:clip-path .85s var(--ease)}
.fg{padding-left:calc(var(--u)*2);display:grid;grid-template-columns:minmax(0,1fr);gap:.15em;align-content:center}
.fg b{font:800 calc(var(--u)*4.2)/1 var(--f-d);color:var(--tc);white-space:nowrap}
.fg b small{font-size:.46em;font-weight:700;margin-left:.2em;letter-spacing:.01em}
.nofig .row{grid-template-columns:calc(var(--u)*10.5) 1fr}
.fg>span{font-size:calc(var(--u)*1.1);color:var(--mut);line-height:1.25}
.fg.ico .bdg{width:calc(var(--u)*5.2);height:calc(var(--u)*5.2);border-radius:50%;display:grid;place-items:center;font-size:calc(var(--u)*2.7);color:var(--tc);border:calc(var(--u)*.2) solid var(--tc);background:#fff}

const FX=(()=>{const cv=$('#fx'),ctx=cv.getContext('2d');let parts=[],raf=0,w=0,h=0;
 function size(){const r=cv.getBoundingClientRect(),dpr=Math.min(2,devicePixelRatio||1);w=r.width;h=r.height;cv.width=Math.round(w*dpr);cv.height=Math.round(h*dpr);ctx.setTransform(dpr,0,0,dpr,0,0)}
 function burst(x,y,n=160){if(RM)return;size();const cols=['#FFB627','#FFD27A','#ffffff','#36B5E0','#E9693F','#53D38A'];
  for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,s=(Math.random()*.9+.35)*h*.02;parts.push({x,y,vx:Math.cos(a)*s*(1+Math.random()),vy:Math.sin(a)*s-h*.014,g:h*.0007,w:(Math.random()*.6+.5)*h*.011,h:(Math.random()*.5+.4)*h*.017,r:Math.random()*6.28,vr:(Math.random()-.5)*.4,c:cols[i%cols.length],life:1})}
  if(!raf)raf=requestAnimationFrame(step)}
 function step(){ctx.clearRect(0,0,w,h);parts=parts.filter(p=>p.life>0&&p.y<h+40);
  for(const p of parts){p.vy+=p.g;p.x+=p.vx;p.y+=p.vy;p.vx*=.992;p.r+=p.vr;p.life-=.0068;ctx.save();ctx.globalAlpha=clamp(p.life*1.6,0,1);ctx.translate(p.x,p.y);ctx.rotate(p.r);ctx.fillStyle=p.c;ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h);ctx.restore()}
  if(parts.length)raf=requestAnimationFrame(step);else{raf=0;ctx.clearRect(0,0,w,h)}}
 return{burst}})();

  const g=ctx.createRadialGradient(R,R,R*.1,R,R,R);g.addColorStop(0,'rgba(0,0,0,.4)');g.addColorStop(.28,'rgba(0,0,0,0)');g.addColorStop(.9,'rgba(0,0,0,0)');g.addColorStop(1,'rgba(0,0,0,.3)');ctx.fillStyle=g;ctx.beginPath();ctx.arc(R,R,R-1,0,7);ctx.fill()}

$('#bPrev').onclick=prev;$('#bNext').onclick=next;$('#bStart').onclick=start;$('#lb').onclick=()=>$('#lb').classList.remove('on');
let rz=0;addEventListener('resize',()=>{cancelAnimationFrame(rz);rz=requestAnimationFrame(()=>{const s=SL[idx];if(s){fitAll(s.el);fitFigs(s.el);if(s.redraw)s.redraw()}})});
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{const s=SL[idx];if(s){fitAll(s.el);fitFigs(s.el);if(s.redraw)s.redraw()}});

/* ---------- Dựng toàn bộ bài ---------- */
(function init(){
 const TOTAL=CH.length*2+MEDIA.length+FIN.length;let qn=0;
 const route=$('.route',hudEl);ST.forEach((x,i)=>{const b=document.createElement('button');b.className='stn';b.dataset.st=i;b.setAttribute('aria-label',(i<5?'Chặng '+(i+1)+': ':'')+x.n);b.innerHTML='<i></i>';b.onclick=()=>{if(STFIRST[i]!=null)go(STFIRST[i])};route.appendChild(b)});
 const qz=(q,topic,st)=>{qn++;buildQuiz({q,topic,st,n:qn,no:'Câu '+qn+'/'+TOTAL,host:HOST[topic]})};
 buildIntro();buildTitle();
 CH.forEach((c,ci)=>{buildChapter(c,ci);buildInfo(c,ci,'geo');qz(c.qg,'geo',ci);buildInfo(c,ci,'inv');qz(c.qi,'inv',ci)});
 MEDIA.forEach((m,mi)=>{buildMedia(m,mi);qz(m.q,m.topic,m.st)});
 FIN.forEach((f,fi)=>{qn++;buildQuiz({q:{q:f.q,h:f.h},topic:f.topic,st:9,fin:true,last:fi===FIN.length-1,n:qn,no:'Câu '+qn+'/'+TOTAL,host:HOST[f.topic]})});
 buildEnd();syncSnd();
 const m=location.hash.match(/^#s(\d+)$/),skip=/[?&]skip\b/.test(location.search);
 if(m||skip){started=true;$('#gate').classList.add('gone');go(clamp((m?+m[1]:2)-1,0,SL.length-1),{instant:true})}
 window.__dn={go,next,prev,SL,POOL,get idx(){return idx}};
})();
})();

</script>
