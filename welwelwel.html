<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Thành phố Đồng Nai: vị trí địa lí và môi trường đầu tư</title>
<meta name="theme-color" content="#06161F">
<meta name="description" content="Bài trình chiếu về vị trí địa lí và môi trường đầu tư của Thành phố Đồng Nai, có vòng quay chọn bạn trả lời câu hỏi.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ============ TOKENS ============ */
:root{
 --u:min(1vw,1.7778vh);
 --ink:#0C2B3A;--ink2:#476170;--river:#0A6C8F;--riverd:#07495F;--basalt:#B5361E;--ember:#E9693F;--lamp:#FFB627;--leaf:#2E7D4F;--night:#06161F;
 --f-d:"Barlow Condensed","Roboto Condensed","Arial Narrow","Segoe UI",system-ui,sans-serif;
 --f-b:"Be Vietnam Pro","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
 --ease:cubic-bezier(.2,.7,.2,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#03090D}
body{font-family:var(--f-b);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
a{color:inherit}ol,ul{list-style:none}
svg.ic{width:1em;height:1em;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
:focus-visible{outline:calc(var(--u)*.22) solid var(--lamp);outline-offset:calc(var(--u)*.2)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ============ STAGE ============ */
#stage{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:calc(var(--u)*100);height:calc(var(--u)*56.25);font-size:var(--u);overflow:hidden;background:var(--night);isolation:isolate;color:#EAF0F2;-webkit-user-select:none;user-select:none}
#deck,.sl{position:absolute;inset:0}
.sl{display:none;overflow:hidden;background:var(--bg);color:var(--fg)}
.sl.act{display:block}
.day{--bg:#E9F0F2;--fg:var(--ink);--mut:var(--ink2);--line:rgba(12,43,58,.16);--cn:rgba(10,108,143,.11);--pn:#fff}
.night{--bg:radial-gradient(120% 90% at 20% 108%,#14405A 0,#0B2433 46%,#06161F 100%);--fg:#EAF0F2;--mut:#93AEBB;--line:rgba(255,255,255,.15);--cn:rgba(255,255,255,.055);--pn:rgba(255,255,255,.07)}
.dusk{--bg:linear-gradient(140deg,#0B7BA3 0,#07495F 50%,#0A2A3A 100%);--fg:#F4FAFC;--mut:#BFE0EA;--line:rgba(255,255,255,.24);--cn:rgba(255,255,255,.11);--pn:rgba(255,255,255,.1)}
.bgc{position:absolute;left:-10%;top:-12%;width:120%;height:124%;color:var(--cn);pointer-events:none}
.bgc path{fill:none;stroke:currentColor;stroke-width:1.3;vector-effect:non-scaling-stroke}
.act .bgc{animation:drift 38s ease-in-out infinite alternate}
@keyframes drift{from{transform:translate(0,0) scale(1)}to{transform:translate(-2.2%,1.6%) scale(1.045)}}
.fit{white-space:nowrap}

/* ============ CHROME ============ */
#hud{position:absolute;left:0;right:0;bottom:calc(var(--u)*1.1);height:calc(var(--u)*3.4);z-index:8;display:flex;align-items:center;gap:calc(var(--u)*2);padding:0 calc(var(--u)*6);pointer-events:none;transition:opacity .5s,color .5s;color:var(--hf,#fff)}
#hud.off{opacity:0}
#hud .hl{width:calc(var(--u)*19);font-size:calc(var(--u)*1.3);font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#hud .hr{width:calc(var(--u)*8);text-align:right;font:700 calc(var(--u)*1.5)/1 var(--f-d);opacity:.8}
.route{position:relative;flex:1;height:100%;display:flex;justify-content:space-between;align-items:center}
.route::before{content:"";position:absolute;left:0;right:0;top:50%;height:calc(var(--u)*.16);margin-top:calc(var(--u)*-.08);background:var(--hm,rgba(255,255,255,.28))}
.route .fill{position:absolute;left:0;top:50%;height:calc(var(--u)*.16);margin-top:calc(var(--u)*-.08);background:var(--hf,var(--lamp));width:0;transition:width .9s var(--ease)}
.stn{position:relative;pointer-events:auto;width:calc(var(--u)*2.4);height:calc(var(--u)*3.4);display:grid;place-items:center}
.stn i{width:calc(var(--u)*.9);height:calc(var(--u)*.9);border-radius:50%;background:var(--hb,#06161F);border:calc(var(--u)*.2) solid var(--hm,rgba(255,255,255,.5));transition:all .5s var(--ease)}
.stn.done i{background:var(--hf,var(--lamp));border-color:var(--hf,var(--lamp))}
.stn.cur i{width:calc(var(--u)*1.55);height:calc(var(--u)*1.55);background:var(--hf,var(--lamp));border-color:var(--hb,#06161F);box-shadow:0 0 0 calc(var(--u)*.22) var(--hf,var(--lamp))}
#stage[data-th=day]{--hf:var(--ink);--hm:rgba(12,43,58,.22);--hb:#E9F0F2}
#stage[data-th=night]{--hf:var(--lamp);--hm:rgba(255,255,255,.26);--hb:#0A1F2C}
#stage[data-th=dusk]{--hf:#fff;--hm:rgba(255,255,255,.34);--hb:#0A5E7C}
#ctl{position:absolute;right:calc(var(--u)*2.2);top:calc(var(--u)*1.1);z-index:9;display:flex;gap:calc(var(--u)*.6);opacity:.5;transition:opacity .3s}
#ctl:hover,#ctl:focus-within{opacity:1}
#ctl.idle{opacity:0}
#ctl button{width:calc(var(--u)*3.1);height:calc(var(--u)*3.1);border-radius:50%;display:grid;place-items:center;font-size:calc(var(--u)*1.65);background:rgba(0,0,0,.3);color:#fff;transition:background .2s}
#ctl button:hover{background:rgba(0,0,0,.55)}
#stage[data-th=day] #ctl button{background:rgba(12,43,58,.1);color:var(--ink)}
#stage[data-th=day] #ctl button:hover{background:rgba(12,43,58,.2)}
.edge{position:absolute;top:18%;bottom:14%;width:calc(var(--u)*4);z-index:7;display:grid;place-items:center;font-size:calc(var(--u)*2.4);color:#fff;opacity:0;transition:opacity .25s;background:linear-gradient(90deg,rgba(0,0,0,.25),transparent)}
.edge.r{right:0;background:linear-gradient(270deg,rgba(0,0,0,.25),transparent)}.edge.l{left:0}
.edge:hover{opacity:.9}
#stage[data-th=day] .edge{color:var(--ink);background:linear-gradient(90deg,rgba(12,43,58,.12),transparent)}
#stage[data-th=day] .edge.r{background:linear-gradient(270deg,rgba(12,43,58,.12),transparent)}
#fx{position:absolute;inset:0;width:100%;height:100%;z-index:30;pointer-events:none}
#toast{position:absolute;left:50%;bottom:calc(var(--u)*7);transform:translate(-50%,calc(var(--u)*1));z-index:60;padding:.7em 1.4em;border-radius:99em;background:rgba(6,22,31,.92);color:#fff;font-size:calc(var(--u)*1.4);font-weight:600;opacity:0;pointer-events:none;transition:all .3s var(--ease);white-space:nowrap;border:1px solid rgba(255,255,255,.18)}
#toast.show{opacity:1;transform:translate(-50%,0)}

/* ============ GATE ============ */
#gate{position:absolute;inset:0;z-index:50;display:grid;place-items:center;background:radial-gradient(90% 90% at 50% 100%,#12384B 0,#06161F 70%);color:#EAF0F2;text-align:center;transition:opacity .7s,visibility .7s}
#gate.gone{opacity:0;visibility:hidden}
#gate .gi{display:grid;justify-items:center;gap:calc(var(--u)*2)}
#gate h1{font:800 calc(var(--u)*9)/.9 var(--f-d)}
#gate h1 .pre{display:block;font:700 .3em/1.15 var(--f-d);letter-spacing:.07em;margin-bottom:.1em;color:#9FE6F7}
#gate p{font-size:calc(var(--u)*1.6);color:#93AEBB;max-width:calc(var(--u)*50);line-height:1.5}
.go{display:inline-flex;align-items:center;gap:.7em;padding:.8em 1.7em .8em 1.3em;border-radius:99em;background:var(--lamp);color:#1B1300;font-weight:800;font-size:calc(var(--u)*1.9);box-shadow:0 .35em 1.8em rgba(255,182,39,.38);transition:transform .2s var(--ease),box-shadow .2s}
.go:hover{transform:translateY(-.1em);box-shadow:0 .5em 2.2em rgba(255,182,39,.5)}
.go .ic{font-size:1.15em}
.go.ghost{background:rgba(255,255,255,.1);color:#fff;box-shadow:none;border:1px solid rgba(255,255,255,.25);font-weight:600}
#gate .pulse{position:relative}
#gate .pulse::before{content:"";position:absolute;inset:-.5em;border-radius:99em;border:2px solid var(--lamp);opacity:0;animation:pulse 2.2s ease-out infinite}
@keyframes pulse{0%{transform:scale(.9);opacity:.8}100%{transform:scale(1.25);opacity:0}}

/* ============ INTRO ============ */
.intro{--f-m:ui-monospace,SFMono-Regular,"Cascadia Mono","Cascadia Code",Consolas,Menlo,"DejaVu Sans Mono","Liberation Mono",monospace;background:#03090D}
.in-cv,.in-c2{position:absolute;inset:0;width:100%;height:100%;display:block}
.in-cv[hidden],.in-c2[hidden]{display:none}
.in-vg{position:absolute;inset:0;pointer-events:none;background:radial-gradient(115% 105% at 50% 48%,transparent 52%,rgba(2,6,10,.62) 100%)}
.in-vg::after{content:"";position:absolute;inset:0;background:radial-gradient(50% 26% at 50% var(--sy,44%),rgba(3,9,13,.72),transparent 74%);opacity:var(--sc,0)}

/* HUD: chỉ là đồ họa, không báo cáo tác vụ thật */
.in-hud{position:absolute;inset:0;pointer-events:none;font:600 calc(var(--u)*1.05)/1.4 var(--f-m);letter-spacing:.14em;color:#7FB8CC;opacity:var(--hd,0)}
.in-hud .tl{position:absolute;left:calc(var(--u)*3);top:calc(var(--u)*2.6);display:grid;gap:calc(var(--u)*.2)}
.in-hud .tl b{color:#CFF4FF;font-weight:700;letter-spacing:.32em}
.in-hud .tl span{opacity:.75}
.in-hud .bl{position:absolute;left:calc(var(--u)*3);bottom:calc(var(--u)*3);display:grid;gap:calc(var(--u)*.2)}
.in-hud .bl span{white-space:nowrap}
.in-hud .bl .sc{color:#CFF4FF}
.in-hud .pg{display:block;position:relative;width:calc(var(--u)*17);height:1px;margin-top:calc(var(--u)*.6);background:rgba(127,184,204,.28)}
.in-hud .pg i{position:absolute;left:0;top:-1px;bottom:-1px;width:calc(var(--pg,0)*100%);background:#00D9FF;box-shadow:0 0 calc(var(--u)*.8) rgba(0,217,255,.7)}
.in-ret{position:absolute;left:50%;top:50%;width:calc(var(--u)*33);height:calc(var(--u)*33);margin:calc(var(--u)*-16.5) 0 0 calc(var(--u)*-16.5);pointer-events:none;opacity:var(--ro,0)}
.in-ret *{fill:none;stroke:#00D9FF}
.in-ret .r1{stroke-width:.8;stroke-opacity:.85;stroke-dasharray:100 100}
.in-ret .r2{stroke-width:4;stroke-opacity:.45;stroke-dasharray:.45 3.55}
.in-ret .r3{stroke-width:1.2;stroke-opacity:.9;stroke-dasharray:36 90 60 120;stroke-linecap:round}
.in-ret .r4{stroke-width:.7;stroke-opacity:.6}

/* nội dung giữa màn hình: tên thương hiệu, mô tả, bảng liên hệ, lời chúc */
.in-c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding-bottom:calc(var(--u)*5.2);pointer-events:none;transform:translate3d(0,calc(var(--sh,0)*1em),0)}
.in-brand{position:relative;margin:0;font:800 calc(var(--u)*11.6)/1.14 var(--f-d);letter-spacing:.012em;color:#F5FAFC;text-align:center;font-kerning:none;font-variant-ligatures:none}
.in-bt{display:block;position:relative;white-space:nowrap}
.in-bt .l{display:inline-block;opacity:0;text-shadow:0 .035em 0 rgba(0,172,212,.5),0 .07em 0 rgba(0,122,162,.38),0 .105em 0 rgba(0,72,102,.3),0 0 .55em rgba(0,217,255,.26)}
.in-bt .mk{display:inline-block;width:0;height:0}
.in-bt::after{content:attr(data-t);position:absolute;left:0;right:0;top:0;text-align:center;white-space:nowrap;pointer-events:none;
 background:linear-gradient(100deg,transparent 38%,rgba(255,226,150,0) 42%,#FFE3A0 48.4%,#fff 50%,#FFE3A0 51.6%,rgba(255,226,150,0) 58%,transparent 62%);background-size:300% 100%;background-position:calc((.85 - var(--sw,0)*.7)*100%) 0;
 -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent;opacity:var(--so,0)}
.in-brand::after{content:"";display:block;height:calc(var(--u)*.2);width:calc(var(--u)*30);max-width:70%;margin:calc(var(--u)*.4) auto 0;background:linear-gradient(90deg,transparent,#FFB627 24%,#FFE3A0 50%,#FFB627 76%,transparent);transform:scaleX(var(--rl,0));opacity:calc(var(--rl,0)*.95)}
.in-tag{margin:calc(var(--u)*1.3) 0 0;font:600 calc(var(--u)*1.65)/1.2 var(--f-b);letter-spacing:.4em;padding-left:.4em;color:#9FE6F7;text-align:center;white-space:nowrap;opacity:var(--tg,0);clip-path:inset(0 calc((1 - var(--tg,0))*50%) 0 calc((1 - var(--tg,0))*50%))}
.in-f{margin-top:calc(var(--u)*1.7);font-size:calc(var(--u)*1.5);color:#8FB0BF;text-align:center;opacity:var(--wf,0);transform:translateY(calc((1 - var(--wf,0))*var(--u)*.8))}

/* bảng thông tin liên hệ (giữ nguyên class .pass và các nút sao chép) */
.pass{position:relative;width:calc(var(--u)*54);display:grid;gap:calc(var(--u)*.35);margin-top:calc(var(--u)*2.6);padding:calc(var(--u)*1.1) calc(var(--u)*2) calc(var(--u)*1.1) calc(var(--u)*2.2);
 background:linear-gradient(180deg,rgba(10,31,44,.66),rgba(6,22,31,.52));border:1px solid rgba(0,217,255,.26);border-radius:calc(var(--u)*.5);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);
 box-shadow:0 0 calc(var(--u)*3) rgba(0,217,255,.1),inset 0 0 calc(var(--u)*2) rgba(0,217,255,.045);
 opacity:var(--pn,0);transform:translateY(calc((1 - var(--pn,0))*var(--u)*2));pointer-events:none}
.pass.on{pointer-events:auto}
.pass::before,.pass::after{content:"";position:absolute;width:calc(var(--u)*1.1);height:calc(var(--u)*1.1);border:2px solid #00D9FF;opacity:.85;pointer-events:none}
.pass::before{left:-1px;top:-1px;border-right:0;border-bottom:0}
.pass::after{right:-1px;bottom:-1px;border-left:0;border-top:0}
.pr{display:grid;grid-template-columns:calc(var(--u)*8.5) 1fr auto;align-items:center;gap:calc(var(--u)*1.2);min-height:calc(var(--u)*3.4)}
.pr .pl{font-size:calc(var(--u)*1.25);color:#8FB0BF;font-weight:600}
.pr .pv{font:700 calc(var(--u)*2.3)/1.1 var(--f-b);color:#fff;text-decoration:none;word-break:break-all}
.pr a.pv{color:#FFD27A}
.pr a.pv:hover{text-decoration:underline}
.cpb{width:calc(var(--u)*3);height:calc(var(--u)*3);border-radius:50%;display:grid;place-items:center;font-size:calc(var(--u)*1.5);background:rgba(255,255,255,.1);color:#fff}
.cpb:hover{background:rgba(255,255,255,.22)}
.pass .bar{width:calc(var(--u)*13);height:calc(var(--u)*1.8);fill:rgba(0,217,255,.4);justify-self:end;margin-top:calc(var(--u)*.1)}
.caret::after{content:"";display:inline-block;width:.08em;height:1em;margin-left:.12em;vertical-align:-.12em;background:var(--lamp);animation:blink .8s steps(2) infinite}
@keyframes blink{50%{opacity:0}}

/* nút vào bài + nút bỏ qua */
.in-go{position:absolute;left:50%;bottom:calc(var(--u)*5.6);transform:translateX(-50%);opacity:0;pointer-events:none;transition:opacity .8s;overflow:hidden}
.in-go.on{opacity:1;pointer-events:auto}
.in-go i{position:absolute;left:0;bottom:0;height:.28em;width:100%;background:rgba(27,19,0,.35);transform-origin:left;transform:scaleX(0)}
.in-go.run i{animation:fillbar var(--ad,6.5s) linear forwards}
@keyframes fillbar{to{transform:scaleX(1)}}
.in-skip{position:absolute;right:calc(var(--u)*3);bottom:calc(var(--u)*3.2);z-index:5;font-size:calc(var(--u)*1.3);font-weight:600;color:#B8D2DD;padding:.5em 1em;border-radius:99em;border:1px solid rgba(255,255,255,.2);background:rgba(3,10,16,.72)}
.in-skip:hover{background:rgba(255,255,255,.12)}
.intro.lv .in-c,.intro.lv .in-hud,.intro.lv .in-ret,.intro.lv .in-go,.intro.lv .in-skip{opacity:0;transition:opacity .45s}
.intro.lite .pass{-webkit-backdrop-filter:none;backdrop-filter:none;background:rgba(6,22,31,.84)}
@media (prefers-reduced-motion:reduce){.in-ret{display:none}}

.in-go:hover{transform:translate(-50%,-.1em)}

/* ============ TITLE ============ */
.tt{padding:0 calc(var(--u)*7)}
.tt-k{position:absolute;left:calc(var(--u)*7);top:calc(var(--u)*4.4);font-size:calc(var(--u)*1.7);font-weight:600;color:var(--mut)}
.tt-h{position:absolute;left:calc(var(--u)*6.4);top:calc(var(--u)*9.4);width:calc(var(--u)*88);font:800 calc(var(--u)*17.5)/.9 var(--f-d);letter-spacing:-.012em;color:#fff;text-shadow:0 calc(var(--u)*.4) calc(var(--u)*2) rgba(0,0,0,.18)}
.tt-h .pre{display:block;font:700 .27em/1.1 var(--f-d);letter-spacing:.03em;margin:0 0 .05em .06em;color:#CFEFF7;text-shadow:none}
.tt-s{position:absolute;left:calc(var(--u)*7);top:calc(var(--u)*31.2);font-size:calc(var(--u)*3.4);font-weight:700;max-width:calc(var(--u)*86);line-height:1.2}
.tt-n{position:absolute;left:calc(var(--u)*7);top:calc(var(--u)*36.8);font-size:calc(var(--u)*1.65);color:var(--mut);display:flex;gap:.6em;align-items:center}
.agenda{position:absolute;left:calc(var(--u)*5);right:calc(var(--u)*5);bottom:calc(var(--u)*4.2);display:grid;grid-template-columns:repeat(10,1fr);border-top:1px solid var(--line)}
.agenda li{padding:calc(var(--u)*1.1) calc(var(--u)*.5) 0 calc(var(--u)*1);position:relative;opacity:0;animation:ag .8s var(--ease) both;animation-delay:calc(.4s + var(--i)*.07s)}
.agenda li::before{content:"";position:absolute;left:calc(var(--u)*1);top:calc(var(--u)*-.45);width:calc(var(--u)*.9);height:calc(var(--u)*.9);border-radius:50%;background:#fff}
.agenda b{display:block;font-size:calc(var(--u)*1.28);font-weight:700;line-height:1.2}
.agenda span{display:block;font-size:calc(var(--u)*1.12);color:var(--mut);line-height:1.25;margin-top:.2em}
@keyframes ag{from{opacity:0;transform:translateY(calc(var(--u)*1))}to{opacity:1;transform:none}}

/* ============ CHAPTER ============ */
.cp .no{position:absolute;left:calc(var(--u)*7);top:calc(var(--u)*6);display:flex;align-items:center;gap:.6em;font-size:calc(var(--u)*2.1);font-weight:700;color:var(--mut)}
.cp .by{position:absolute;left:calc(var(--u)*7);top:calc(var(--u)*30.4);display:flex;align-items:baseline;gap:.7em;font-size:calc(var(--u)*2);color:var(--mut)}
.cp .by b{font-size:1.3em;color:#fff;font-weight:700}
.cp h1{position:absolute;left:calc(var(--u)*6.4);top:calc(var(--u)*10.5);width:calc(var(--u)*88);font:800 calc(var(--u)*19)/.9 var(--f-d);letter-spacing:-.012em;color:#fff}
.lanes{position:absolute;left:calc(var(--u)*7);right:calc(var(--u)*7);bottom:calc(var(--u)*9);display:grid;grid-template-columns:1fr 1fr;gap:calc(var(--u)*5)}
.lane{display:grid;grid-template-columns:calc(var(--u)*6.2) 1fr;column-gap:calc(var(--u)*1.8);align-items:center;position:relative;padding-bottom:calc(var(--u)*2.4)}
.lane .bd{width:calc(var(--u)*6.2);height:calc(var(--u)*6.2);border-radius:50%;display:grid;place-items:center;font-size:calc(var(--u)*3);background:#fff;color:var(--river);opacity:0;transform:scale(.6)}
.lane.inv .bd{color:var(--basalt)}
.lane h3{font-size:calc(var(--u)*2.7);font-weight:700;line-height:1.1;opacity:0}
.lane p{font-size:calc(var(--u)*1.45);color:var(--mut);margin-top:.25em;opacity:0}
.lane .ln{position:absolute;left:0;bottom:0;width:100%;height:calc(var(--u)*.3);border-radius:99em;background:#fff;transform-origin:left;transform:scaleX(0)}
.lane.inv .ln{background:#FFB48F}
.cp.play .lane .ln{animation:dline 1.5s var(--ease) .9s forwards}
.cp.play .lane.inv .ln{animation-delay:1.25s}
.cp.play .lane .bd{animation:pop .7s var(--ease) .55s forwards}
.cp.play .lane.inv .bd{animation-delay:.9s}
.cp.play .lane h3,.cp.play .lane p{animation:fi .7s var(--ease) .8s forwards}
.cp.play .lane.inv h3,.cp.play .lane.inv p{animation-delay:1.15s}
.cp.play h1 .w{animation:rise .9s var(--ease) both;animation-delay:calc(.1s + var(--i)*.05s)}

 $('.hl',hudEl).textContent=s.st>=0?(s.st<5?'Chặng '+(s.st+1)+': ':'')+ST[s.st].n:(s.type==='end'?'Kết thúc':'Mở đầu');$('.hr',hudEl).textContent=(i+1)+' / '+SL.length}
function transition(from,to,dir){
 const f=from.el,t=to.el,A=(el,kf,o)=>el.animate(kf,Object.assign({duration:720,easing:'cubic-bezier(.2,.7,.2,1)',fill:'both'},o)).finished;
 const nf=from.th==='night',nt=to.th==='night';
 if(from.type==='intro'){t.style.zIndex=2;Sfx.whoosh(.14);return A(t,[{opacity:0,transform:'scale(1.04)'},{opacity:1,transform:'none'}],{duration:1100})}
 if(nt&&!nf){t.style.zIndex=2;f.style.zIndex=1;Sfx.whoosh(.12);return Promise.all([A(t,[{clipPath:'circle(0% at 18% 82%)'},{clipPath:'circle(150% at 18% 82%)'}],{duration:1050,easing:'cubic-bezier(.5,0,.2,1)'}),A(f,[{filter:'brightness(1)'},{filter:'brightness(.45)'}],{duration:1050})])}
 if(nf&&!nt){f.style.zIndex=2;t.style.zIndex=1;Sfx.whoosh(.12);return A(f,[{clipPath:'circle(150% at 18% 82%)'},{clipPath:'circle(0% at 18% 82%)'}],{duration:950,easing:'cubic-bezier(.6,0,.3,1)'})}
 if(to.type==='chapter'){t.style.zIndex=2;Sfx.whoosh(.12);const a=dir>0?['polygon(0 0,0 0,-30% 100%,-30% 100%)','polygon(0 0,130% 0,100% 100%,-30% 100%)']:['polygon(100% 0,100% 0,130% 100%,130% 100%)','polygon(100% 0,-30% 0,0 100%,130% 100%)'];return A(t,[{clipPath:a[0]},{clipPath:a[1]}],{duration:1000,easing:'cubic-bezier(.65,0,.35,1)'})}
 const d=dir>0?1:-1;t.style.zIndex=2;Sfx.whoosh(.06);
 return Promise.all([A(t,[{opacity:0,transform:'translateX('+(6*d)+'%)'},{opacity:1,transform:'none'}]),A(f,[{opacity:1,transform:'none'},{opacity:0,transform:'translateX('+(-6*d)+'%)'}])])}
function go(n,opt){opt=opt||{};n=clamp(n,0,SL.length-1);if(n===idx)return;if(busy&&!opt.instant)return;
 const from=SL[idx]||null,to=SL[n],dir=n>idx?1:-1;if(from&&from.leave)from.leave();
 to.el.classList.add('act');to.el.scrollTop=0;stage.dataset.th=to.th;updateHud(n);idx=n;try{history.replaceState(null,'','#s'+(n+1))}catch(e){}
 if(to.enter)to.enter(dir,!!from&&!opt.instant);
 if(!from||opt.instant||RM){if(from)from.el.classList.remove('act');return}
 busy=true;let ended=false;const fin=()=>{if(ended)return;ended=true;[from.el,to.el].forEach(e=>{e.getAnimations().forEach(a=>a.cancel());e.style.cssText=''});from.el.classList.remove('act');busy=false};
 setTimeout(fin,1500);transition(from,to,dir).then(fin,fin)}
function next(){if(busy)return;const s=SL[idx];if(s&&s.adv&&s.adv())return;go(idx+1)}
function prev(){if(busy)return;go(idx-1)}

/* ---------- Lớp phủ: danh sách, trợ giúp, cài đặt ---------- */
const ovl=$('#ovl');
function closeOvl(){ovl.classList.remove('on');ovl.innerHTML=''}
const tlabel={intro:'Giới thiệu',title:'Mở đầu',chapter:'Mở chặng',info:'Thông tin',quiz:'Câu hỏi',media:'Video / ảnh',end:'Kết thúc'};
function openOverview(){let h=`<div class="pnl"><button class="x" data-close aria-label="Đóng">${ic('x')}</button><h2>Danh sách slide</h2>`;
 const groups=[{n:'Mở đầu',f:s=>s.type==='intro'||s.type==='title'}].concat(ST.map((x,i)=>({n:(i<5?'Chặng '+(i+1)+': ':'')+x.n+' ('+x.by+')',f:s=>s.st===i}))).concat([{n:'Kết thúc',f:s=>s.type==='end'}]);
 groups.forEach(g=>{const a=SL.filter(g.f);if(!a.length)return;h+=`<h3>${esc(g.n)}</h3><div class="ov-g">${a.map(s=>`<button data-go="${s.i}" class="${s.i===idx?'cur':''}">${esc(s.title)}<small>${tlabel[s.type]}</small></button>`).join('')}</div>`});
 ovl.innerHTML=h+'</div>';ovl.classList.add('on')}
function openHelp(){const k=[['Space, Enter, →','Hiện ý tiếp theo, quay vòng quay, hiện đáp án, rồi sang slide sau'],['←','Quay lại slide trước'],['G','Danh sách slide để nhảy nhanh'],['F','Bật hoặc tắt toàn màn hình'],['M','Bật hoặc tắt âm thanh'],['S','Cài đặt vòng quay và đồng hồ'],['R','Làm mới vòng quay (cho mọi bạn quay lại)'],['Esc','Đóng cửa sổ đang mở']];
 ovl.innerHTML=`<div class="pnl"><button class="x" data-close aria-label="Đóng">${ic('x')}</button><h2>Phím tắt</h2><div class="kk">${k.map(r=>`<kbd>${r[0]}</kbd><span>${r[1]}</span>`).join('')}</div><h3>Video và hình ảnh</h3><p style="font-size:calc(var(--u)*1.35);line-height:1.5;color:#CFE0E8">Ở các slide video và hình ảnh, bạn phụ trách chọn tệp từ máy (hoặc kéo thả vào khung) để phát ổn định. Tệp được lưu trong trình duyệt này, mở lại vẫn còn. Với video YouTube, hãy dán liên kết rồi nhấn phát.</p></div>`;ovl.classList.add('on')}
function openSettings(){const sw=(k,v)=>`<button class="sw" role="switch" aria-checked="${v}" data-set="${k}"></button>`;
 ovl.innerHTML=`<div class="pnl sm"><button class="x" data-close aria-label="Đóng">${ic('x')}</button><h2>Cài đặt</h2>
 <div class="st"><div>Âm thanh<small>Tiếng chốt, tiếng quay, hiệu ứng chúc mừng</small></div>${sw('snd',Sfx.on)}</div>
 <div class="st"><div>Loại bạn đã trả lời khỏi vòng quay<small>Mỗi bạn chỉ được chọn một lần (vòng chung kết không áp dụng)</small></div>${sw('rem',POOL.remove)}</div>
 <div class="st"><div>Đồng hồ đếm ngược<small>Bắt đầu sau khi chọn được bạn trả lời</small></div><div class="seg">${[0,15,20,30].map(v=>`<button data-tm="${v}" aria-pressed="${POOL.timer===v}">${v?v+' giây':'Tắt'}</button>`).join('')}</div></div>
 <div class="st"><div>Đã chọn ${POOL.picked.size} trong ${NAMES.length} bạn</div><button class="ghostb" data-set="reset">Làm mới vòng quay</button></div></div>`;ovl.classList.add('on')}
function resetPool(){POOL.picked.clear();LS.set('picked',[]);const s=SL[idx];if(s&&s.refresh)s.refresh();toast('Đã làm mới vòng quay: cả 43 bạn')}
function syncSnd(){$('#bSnd use').setAttribute('href',Sfx.on?'#i-vol':'#i-mute')}
ovl.addEventListener('click',e=>{const t=e.target;if(t===ovl||t.closest('[data-close]')){closeOvl();return}
 const g=t.closest('[data-go]');if(g){closeOvl();go(+g.dataset.go);return}
 const st=t.closest('[data-set]');if(st){const k=st.dataset.set;if(k==='snd'){Sfx.setOn(!Sfx.on);syncSnd()}else if(k==='rem'){POOL.remove=!POOL.remove;LS.set('remove',POOL.remove);const s=SL[idx];if(s&&s.refresh)s.refresh()}else if(k==='reset')resetPool();openSettings();return}
 const tmb=t.closest('[data-tm]');if(tmb){POOL.timer=+tmb.dataset.tm;LS.set('timer',POOL.timer);openSettings()}});

/* ---------- Toàn màn hình, phím, cảm ứng ---------- */
function fs(){const d=document,el=d.documentElement;if(d.fullscreenElement||d.webkitFullscreenElement){(d.exitFullscreen||d.webkitExitFullscreen).call(d)}else{(el.requestFullscreen||el.webkitRequestFullscreen||function(){}).call(el)}}
function start(){if(started)return;started=true;Sfx.unlock();$('#gate').classList.add('gone');go(0,{instant:true})}
addEventListener('pointerdown',()=>Sfx.unlock());
addEventListener('keydown',e=>{if(e.ctrlKey||e.metaKey||e.altKey)return;const t=e.target;if(t&&/^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName))return;
 if(!started){if(e.key==='Enter'||e.key===' '){e.preventDefault();start()}else if(e.key==='f'||e.key==='F')fs();return}
 if($('#lb').classList.contains('on')){if(e.key==='Escape'||e.key===' '||e.key==='Enter'){e.preventDefault();$('#lb').classList.remove('on')}return}
 if(ovl.classList.contains('on')){if(e.key==='Escape'){e.preventDefault();closeOvl()}return}
 const k=e.key,own=t&&t.closest&&t.closest('.vbox,.gs,.pass,#ctl,.ovl,a,.in-skip,.in-go');
 switch(k){
  case 'ArrowRight':case 'PageDown':e.preventDefault();next();break;
  case ' ':case 'Enter':if(own)return;e.preventDefault();if(document.activeElement&&document.activeElement.blur)document.activeElement.blur();next();break;
  case 'ArrowLeft':case 'PageUp':case 'Backspace':e.preventDefault();prev();break;
  case 'Home':e.preventDefault();go(0);break;case 'End':e.preventDefault();go(SL.length-1);break;
  case 'f':case 'F':fs();break;case 'm':case 'M':Sfx.setOn(!Sfx.on);syncSnd();toast(Sfx.on?'Âm thanh: bật':'Âm thanh: tắt');break;
  case 'g':case 'G':openOverview();break;case 'h':case 'H':case '?':openHelp();break;case 's':case 'S':openSettings();break;case 'r':case 'R':resetPool();break}});
let tx=0,ty=0;stage.addEventListener('touchstart',e=>{tx=e.touches[0].clientX;ty=e.touches[0].clientY},{passive:true});
stage.addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-tx,dy=e.changedTouches[0].clientY-ty;if(Math.abs(dx)>70&&Math.abs(dx)>Math.abs(dy)*1.6&&started&&!ovl.classList.contains('on')){dx<0?next():prev()}},{passive:true});
let idleT=0;addEventListener('mousemove',()=>{const c=$('#ctl');c.classList.remove('idle');clearTimeout(idleT);idleT=setTimeout(()=>{if(document.fullscreenElement)c.classList.add('idle')},2800)});
$('#bOv').onclick=openOverview;$('#bSet').onclick=openSettings;$('#bHelp').onclick=openHelp;$('#bFs').onclick=fs;$('#bSnd').onclick=()=>{Sfx.setOn(!Sfx.on);syncSnd();toast(Sfx.on?'Âm thanh: bật':'Âm thanh: tắt')};
$('#bPrev').onclick=prev;$('#bNext').onclick=next;$('#bStart').onclick=start;$('#lb').onclick=()=>$('#lb').classList.remove('on');
let rz=0;addEventListener('resize',()=>{cancelAnimationFrame(rz);rz=requestAnimationFrame(()=>{const s=SL[idx];if(s){fitAll(s.el);fitFigs(s.el);if(s.redraw)s.redraw()}})});
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{const s=SL[idx];if(s){fitAll(s.el);fitFigs(s.el);if(s.redraw)s.redraw()}});

/* ---------- Dựng toàn bộ bài ---------- */
(function init(){
 const TOTAL=CH.length*2+MEDIA.length+FIN.length;let qn=0;
 const route=$('.route',hudEl);ST.forEach((x,i)=>{const b=document.createElement('button');b.className='stn';b.dataset.st=i;b.setAttribute('aria-label',(i<5?'Chặng '+(i+1)+': ':'')+x.n);b.innerHTML='<i></i>';b.onclick=()=>{if(STFIRST[i]!=null)go(STFIRST[i])};route.appendChild(b)});
 const qz=(q,topic,st)=>{qn++;buildQuiz({q,topic,st,n:qn,no:'Câu '+qn+'/'+TOTAL,host:HOST[topic]})};
 buildIntro();buildTitle();
 CH.forEach((c,ci)=>{buildChapter(c,ci);buildInfo(c,ci,'geo');qz(c.qg,'geo',ci);buildInfo(c,ci,'inv');qz(c.qi,'inv',ci)});
 MEDIA.forEach((m,mi)=>{buildMedia(m,mi);qz(m.q,m.topic,m.st)});
 FIN.forEach((f,fi)=>{qn++;buildQuiz({q:{q:f.q,h:f.h},topic:f.topic,st:9,fin:true,last:fi===FIN.length-1,n:qn,no:'Câu '+qn+'/'+TOTAL,host:HOST[f.topic]})});
 buildEnd();syncSnd();
 const m=location.hash.match(/^#s(\d+)$/),skip=/[?&]skip\b/.test(location.search);
 if(m||skip){started=true;$('#gate').classList.add('gone');go(clamp((m?+m[1]:2)-1,0,SL.length-1),{instant:true})}
 window.__dn={go,next,prev,SL,POOL,intro:buildIntro.api,get idx(){return idx}};
})();
})();
