<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Particle flag — visual prototype</title>
<style>
:root{color-scheme:dark;font-family:'Segoe UI',Arial,sans-serif;background:#02050b;color:#e6dccb}*{box-sizing:border-box}body{margin:0;overflow:hidden}#flag-stage{position:absolute;width:min(100vw,177.7778vh);height:min(56.25vw,100vh);left:50%;top:50%;transform:translate(-50%,-50%);overflow:hidden;background:#02050b}#flag-canvas{width:100%;height:100%;display:block}#flag-controls{position:fixed;left:24px;bottom:22px;display:flex;gap:16px;align-items:center;flex-wrap:wrap;padding:8px 0;font-size:15px}button,select{font:inherit;color:inherit;border:1px solid #d8a85c55;background:#111019;border-radius:4px;min-height:44px;padding:9px 14px}button:hover,select:hover{border-color:#d8a85c}label{display:flex;align-items:center;gap:9px}input{accent-color:#d8a85c;width:18px;height:18px}:focus-visible{outline:2px solid #e6bc6a;outline-offset:4px}#flag-notice{position:fixed;left:24px;top:20px;max-width:70vw;font-size:16px;line-height:1.4;color:#e6bc6a}#flag-static{position:absolute;left:40%;top:12%;width:50%;height:auto}[hidden]{display:none!important}::selection{background:#d8a85c;color:#02050b}@media(max-width:550px){#flag-controls{left:16px;right:16px;bottom:14px;gap:8px 14px;font-size:14px}}
